name: Publish the CRP7 website

# Runs on every push to main, including edits made through GitHub's web editor.
# Problems in content/ are reported as annotations and never fail the run — see
# the contract described in src/content/load.ts.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Cache the resized images so a text-only edit does not re-encode photos.
      - name: Restore image cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: images-${{ hashFiles('content/**/*.jpg', 'content/**/*.jpeg', 'content/**/*.png', 'content/**/*.webp') }}
          restore-keys: images-

      - name: Build site
        run: npm run build

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Check out the PDAC results atlas
        uses: actions/checkout@v4
        with:
          repository: arunviswanathan91/models-obesity
          ref: ff9b16e16606bbbef7aef24ed0f3cfb5cbf732c2
          path: atlas-source
          persist-credentials: false

      - name: Include the PDAC results atlas
        run: |
          mkdir -p docs/models-obesity
          cp -R atlas-source/web/. docs/models-obesity/
          python3 atlas-source/scripts/vendor_plot_runtime.py docs/models-obesity

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
